services:
  - type: web
    name: lifenexus
    env: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
